# Streamline single-node deployment.
#
# There is NO published Streamline image yet, so this file has no runnable
# default: `docker-publish.yml` (the single publisher) has never pushed a tag
#
# Build the image from the pinned core commit first:
#
#   scripts/prepare-core-context.sh        # materialises .build/core
#   make docker                            # -> streamline:dev
#   STREAMLINE_IMAGE=streamline:dev docker compose up -d
#
# The placeholder default below is local-only and matches nothing in any
# registry: `docker compose config` (and `make compose-config`) stays valid with
# no environment set, while `up` stops with a pull error naming the variable to
# set instead of pretending a registry tag exists.
#
# When images are published, GHCR is the only registry they will appear in:
# .github/workflows/docker-publish.yml pushes ghcr.io tags only, and only after
# a staged digest passes smoke, scan, signing and attestation.
#
# This repository contains no Streamline core sources, so there is deliberately
# no `build:` stanza here; see Dockerfile and scripts/prepare-core-context.sh.
services:
  streamline:
    image: ${STREAMLINE_IMAGE:-streamline:set-STREAMLINE_IMAGE}
    container_name: streamline
    ports:
      - "9092:9092"   # Kafka protocol
      - "9094:9094"   # HTTP API
    volumes:
      - streamline_data:/data
    env_file:
      - path: .env
        required: false
    environment:
      - STREAMLINE_LISTEN_ADDR=0.0.0.0:9092
      - STREAMLINE_DATA_DIR=/data
      - STREAMLINE_LOG_LEVEL=info
      - RUST_LOG=info
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9094/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

volumes:
  streamline_data:
    driver: local
