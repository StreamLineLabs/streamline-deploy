suite: Streamline core resources
templates:
  - statefulset.yaml
  - service.yaml
  - pdb.yaml
  - hpa.yaml
  - keda-scaledobject.yaml
values:
  # The chart ships no default image.tag (nothing is published yet), so every
  # suite names an explicit test image — see tests/values/test-image.yaml.
  - values/test-image.yaml
tests:
  - it: should create a StatefulSet with correct name
    template: statefulset.yaml
    asserts:
      - isKind:
          of: StatefulSet
      - equal:
          path: metadata.name
          value: RELEASE-NAME-streamline

  - it: should create a Service with correct ports
    template: service.yaml
    documentIndex: 1
    asserts:
      - isKind:
          of: Service
      - equal:
          path: metadata.name
          value: RELEASE-NAME-streamline
      - contains:
          path: spec.ports
          content:
            name: kafka
            port: 9092
            targetPort: kafka
      - contains:
          path: spec.ports
          content:
            name: http
            port: 9094
            targetPort: http

  - it: should create a PDB when enabled
    template: pdb.yaml
    set:
      podDisruptionBudget.enabled: true
    asserts:
      - isKind:
          of: PodDisruptionBudget
      - equal:
          path: metadata.name
          value: RELEASE-NAME-streamline
      - equal:
          path: spec.minAvailable
          value: 1

  - it: should not create a PDB when disabled
    template: pdb.yaml
    set:
      podDisruptionBudget.enabled: false
    asserts:
      - hasDocuments:
          count: 0

  # Horizontal scaling is unsupported: an autoscaler raises the StatefulSet
  # replica count directly, bypassing the replicaCount > 1 guard. The render
  # fails chart-wide (streamline.validateConfiguration), so the rejection is
  # asserted in tests/security_test.yaml; here we only pin that neither
  # autoscaler object is produced.
  - it: should not create an HPA when autoscaling is disabled
    template: hpa.yaml
    set:
      autoscaling.enabled: false
    asserts:
      - hasDocuments:
          count: 0

  - it: should not create a KEDA ScaledObject by default
    template: keda-scaledobject.yaml
    asserts:
      - hasDocuments:
          count: 0
