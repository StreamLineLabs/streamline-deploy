# =============================================================================
# Streamline Helm Chart — values.yaml
# =============================================================================
# Full reference: https://streamlinelabs.dev/docs/operations/helm-values
#
# Quick start:
#   helm install streamline ./helm/streamline
#
# Production-style single-broker deployment with monitoring:
#   helm install streamline ./helm/streamline \
#     --set metrics.serviceMonitor.enabled=true \
#     --set persistence.size=50Gi
# =============================================================================

# -- Number of Streamline broker replicas.
# Multi-broker peer bootstrap is not implemented by this chart yet. Values
# greater than 1 fail rendering rather than create independent brokers.
replicaCount: 1

# -- Pod management policy for the StatefulSet.
# "Parallel" starts all pods simultaneously (faster, good for single-node).
# "OrderedReady" is reserved for future clustered deployments.
podManagementPolicy: Parallel

# -- Container image configuration.
# There is no default tag: no Streamline image is published yet, so the chart
# refuses to render until you name an image you can actually pull.
image:
  # -- Docker image registry and name. This is where the project's images will
  # be published (`.github/workflows/docker-publish.yml` pushes ghcr.io only);
  # point it at your own registry until a release exists.
  repository: ghcr.io/streamlinelabs/streamline
  # -- Image tag. REQUIRED — an empty value fails the render.
  # No published tag exists: `docker-publish.yml` has pushed nothing while
  # core-source.env carries no pinned core commit. Build an image from the
  # pinned commit (`scripts/prepare-core-context.sh` then `make docker`), push
  # it where the cluster can pull it, and set repository/tag explicitly.
  tag: ""
  # -- Image pull policy: Always, IfNotPresent, or Never
  pullPolicy: IfNotPresent
  # -- Edition of the image above; decides which optional chart features may be
  # switched on. Enabling an unsupported feature fails the render rather than
  # deploying a server that silently ignores it. The values mirror the
  # STREAMLINE_EDITION build arg in Dockerfile:
  #   standard — default cargo features (no STREAMLINE_FEATURES). TLS is
  #              available (it is compiled into every build), but SASL auth and
  #              clustering are not.
  #   full     — STREAMLINE_EDITION=full, which accepts exactly
  #              STREAMLINE_FEATURES=full (core's own meta-feature): adds SASL
  #              auth and clustering. This is what the publisher builds.
  #   custom   — STREAMLINE_EDITION=custom with an arbitrary
  #              STREAMLINE_FEATURES list. The chart infers NOTHING from such a
  #              build: image.capabilities below must declare what it supports.
  # The experimental moonshot feature set is not advertised by any edition, and
  # the chart cannot configure it yet: any moonshot.*.enabled=true fails the
  # render (see the Moonshot Features section below).
  edition: full
  # -- Explicit capability list for custom images, e.g. ["auth", "clustering"].
  # Accepted ONLY with edition: custom, where it is REQUIRED — a custom build's
  # feature list is arbitrary, so the chart never guesses that it carries auth
  # or clustering. Declare exactly what the image records in its
  # dev.streamline.capabilities label.
  # Recognised values: auth, clustering, moonshot, none.
  # Use ["none"] for a custom build that supports none of them — an explicit
  # "nothing" is still a declaration; an empty list is not.
  # "moonshot" only describes what the image contains; it does not enable the
  # moonshot settings below, which the chart still refuses to render.
  # "tls" is accepted for backwards compatibility and ignored — TLS needs no
  # capability because core builds it into the default binary.
  capabilities: []

# -- Secrets for pulling images from private registries
imagePullSecrets: []
# -- Override the chart name
nameOverride: ""
# -- Override the full release name
fullnameOverride: ""

# =============================================================================
# Server Configuration
# =============================================================================

# -- Streamline server configuration passed as CLI flags
config:
  # -- Log level: trace, debug, info, warn, error
  logLevel: info
  # -- Data directory for persistent segment storage
  dataDir: /data
  # -- Kafka protocol listen address (clients connect here).
  # The port is FIXED at 9092: the container port, probes, Services and
  # NetworkPolicy all hard-code it, so a different value would render a
  # workload whose Service points at a port nothing listens on. Any other port
  # fails the render (values.schema.json rejects it first).
  kafkaAddr: "0.0.0.0:9092"
  # -- HTTP API listen address (REST, metrics, health checks).
  # The port is FIXED at 9094, for the same reason as kafkaAddr.
  httpAddr: "0.0.0.0:9094"
  # -- Auto-create topics when a producer writes to a non-existent topic.
  # Always rendered into the ConfigMap as STREAMLINE_AUTO_CREATE_TOPICS
  # ("true"/"false") because Streamline core defaults this to enabled.
  # ⚠️  PRODUCTION: Set to false to prevent accidental topic creation from
  # typos or misconfigured clients. Use explicit topic provisioning instead.
  autoCreateTopics: false
  # -- Playground mode creates demo topics with sample data on startup.
  # Useful for evaluation and demos; disable in production.
  playground: false
  # -- Ephemeral mode stores all data in-memory only (no disk persistence).
  # Use for CI/CD testing. All data is lost on restart.
  ephemeral: false
  # -- Extra CLI arguments passed directly to the streamline binary.
  # Only flags the pinned image actually accepts belong here; an unknown flag
  # makes the server exit at startup.
  # Example: ["--max-message-bytes", "10485760"]
  extraArgs: []
  # -- Reserved for future multi-node Raft bootstrap.
  # Enabling this currently fails rendering.
  clusterEnabled: false
  # -- Inter-broker communication port (reserved for Raft replication).
  # FIXED at 9093: the headless Service and the container port hard-code it,
  # and clustering is rejected by this chart anyway.
  interBrokerPort: 9093

# =============================================================================
# Networking
# =============================================================================
# The listener ports are FIXED. 9092 (Kafka) and 9094 (HTTP) are hard-coded in
# the container `ports:`, the named ports the probes and Services target, the
# NetworkPolicy rules, the ServiceMonitor endpoint and the Prometheus scrape
# annotations. Values that pretend to move a listener are rejected — both by
# values.schema.json and by the chart's own guard — because changing one of
# them produced a broker that never became ready and a Service pointing at a
# port nothing served. Publish a different port outside the pod instead (your
# own Service, an ingress, or `kubectl port-forward`).

# -- Internal ClusterIP service configuration
service:
  # -- Service type: ClusterIP, NodePort, LoadBalancer
  type: ClusterIP
  # -- Kafka protocol port. Fixed at 9092; other values fail the render.
  kafkaPort: 9092
  # -- HTTP API port. Fixed at 9094; other values fail the render.
  httpPort: 9094
  # -- Additional annotations (e.g., for service mesh)
  annotations: {}

# -- External service for client access outside the cluster
externalService:
  # -- Enable a separate LoadBalancer service for external access
  enabled: false
  # -- External service type
  type: LoadBalancer
  # -- External Kafka port. Fixed at 9092: it targets the same fixed container
  # port. Map a different external port with a Service of your own.
  kafkaPort: 9092
  # -- Annotations (e.g., cloud provider LB config)
  annotations: {}

# =============================================================================
# Storage
# =============================================================================

# -- Persistent volume configuration for segment data
persistence:
  # -- Enable persistent storage. Disable only for ephemeral/testing deployments.
  enabled: true
  # -- Storage class name. Empty string uses the cluster default.
  storageClass: ""
  # -- Access mode: ReadWriteOnce (single node) or ReadWriteMany (shared)
  accessMode: ReadWriteOnce
  # -- Volume size. Size depends on retention policy and throughput.
  # Rule of thumb: daily_bytes × retention_days × 1.2 (overhead)
  size: 10Gi
  # -- Additional PVC annotations
  annotations: {}

# =============================================================================
# Resources & Security
# =============================================================================

# -- CPU and memory resource requests and limits.
# Adjust based on expected throughput:
#   Light (< 10K msg/s):  256Mi / 100m request, 1Gi / 1000m limit
#   Medium (10-100K msg/s): 1Gi / 500m request, 4Gi / 2000m limit
#   Heavy (> 100K msg/s):  4Gi / 2000m request, 16Gi / 8000m limit
resources:
  requests:
    memory: "256Mi"
    cpu: "100m"
  limits:
    memory: "1Gi"
    cpu: "1000m"

# -- Pod-level security context applied to all containers
podSecurityContext:
  # -- File system group ID for volume mounts
  fsGroup: 1000
  # -- Require non-root user
  runAsNonRoot: true
  # -- User ID for the streamline process
  runAsUser: 1000

# -- Graceful shutdown timeout in seconds.
# Should be >= your longest in-flight produce batch timeout.
terminationGracePeriodSeconds: 30

# -- Container-level security context (applied to the streamline container)
securityContext:
  # -- Prevent privilege escalation
  allowPrivilegeEscalation: false
  # -- Read-only root filesystem (writes go to /tmp emptyDir)
  readOnlyRootFilesystem: true
  # -- Drop all Linux capabilities
  capabilities:
    drop:
      - ALL

# =============================================================================
# Health Probes
# =============================================================================

# -- Liveness probe detects deadlocked processes. Failing pods are restarted.
livenessProbe:
  httpGet:
    path: /health/live
    port: http
  initialDelaySeconds: 10
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3

# -- Readiness probe gates traffic. Failing pods are removed from Service endpoints.
readinessProbe:
  httpGet:
    path: /health/ready
    port: http
  initialDelaySeconds: 5
  periodSeconds: 5
  timeoutSeconds: 3
  failureThreshold: 3

# -- Startup probe allows slow starts. Liveness/readiness are paused until this succeeds.
startupProbe:
  httpGet:
    path: /health/live
    port: http
  initialDelaySeconds: 5
  periodSeconds: 5
  timeoutSeconds: 3
  # -- 30 failures × 5s = 150s maximum startup time
  failureThreshold: 30

# =============================================================================
# Scheduling
# =============================================================================

# -- Node selector for pod placement
nodeSelector: {}

# -- Tolerations for node taints
tolerations: []

# -- Affinity rules for pod placement.
# Default: soft anti-affinity to spread replicas across nodes.
affinity:
  podAntiAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 100
        podAffinityTerm:
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: streamline
          topologyKey: kubernetes.io/hostname

# -- Pod Disruption Budget ensures minimum availability during voluntary disruptions.
# Set minAvailable < replicaCount to allow rolling updates.
podDisruptionBudget:
  enabled: true
  # -- Minimum pods that must remain available during disruption
  minAvailable: 1

# =============================================================================
# Observability
# =============================================================================

# -- Prometheus metrics configuration
metrics:
  # -- Enable the /metrics endpoint on the HTTP port
  enabled: true
  # -- ServiceMonitor for Prometheus Operator auto-discovery
  serviceMonitor:
    # -- Create a ServiceMonitor resource
    enabled: false
    # -- Scrape interval
    interval: 15s
    # -- Scrape timeout (must be < interval)
    scrapeTimeout: 10s
    # -- Additional labels for ServiceMonitor selection
    labels: {}
  # -- PrometheusRule for alerting
  prometheusRule:
    # -- Create a PrometheusRule resource
    enabled: false
    # -- Additional labels for rule selection
    labels: {}
    # -- Alert thresholds (customize per environment)
    thresholds:
      produceLatencyWarning: 0.1    # p99 produce latency in seconds
      fetchLatencyWarning: 0.2      # p99 fetch latency in seconds
      consumerLagWarning: 10000     # consumer lag in messages
      consumerLagCritical: 100000   # critical consumer lag threshold
    # -- Additional custom alerting rules appended to the rule groups
    additionalRules: []
  # -- Grafana dashboard ConfigMaps
  grafanaDashboards:
    # -- Create Grafana dashboard ConfigMaps
    # Dashboards are enabled by default for use with the monitoring profile
    enabled: true
    # -- Additional labels for dashboard discovery
    labels: {}
    # -- Namespace where Grafana is installed (defaults to release namespace)
    namespace: ""
    # -- Grafana folder name for the dashboards
    folder: "Streamline"

# =============================================================================
# Network Policy
# =============================================================================

# -- Network policy restricts pod-to-pod traffic.
# Default: only pods in the same namespace can access Kafka and HTTP ports.
# The ports are fixed at 9092/9094 (the only ports the workload listens on);
# any other value here fails the render. Use additionalIngress for extra rules.
networkPolicy:
  enabled: true
  ingress:
    - from:
        - podSelector: {}  # same namespace
      ports:
        - port: 9092
          protocol: TCP
        - port: 9094
          protocol: TCP
  # -- Additional custom ingress rules
  additionalIngress: []
  # -- Additional custom egress rules
  additionalEgress: []

# =============================================================================
# Autoscaling — NOT SUPPORTED YET
# =============================================================================
# WARNING: this chart cannot scale Streamline horizontally. An autoscaler edits
# the StatefulSet's replica count directly, which would bypass the
# `replicaCount > 1` guard and start extra pods as independent brokers with
# their own data — not as cluster members, because peer bootstrap is not
# implemented (see config.clusterEnabled). Setting autoscaling.enabled or
# keda.enabled to true therefore FAILS THE RENDER. The keys below are kept to
# document the intended shape once clustered mode exists. Scale vertically with
# `resources` in the meantime.

# -- Horizontal Pod Autoscaler (standard Kubernetes HPA).
# Unsupported: `enabled: true` fails the render until clustered mode exists.
autoscaling:
  # -- Enable the HPA. Must stay false; true fails the render.
  enabled: false
  minReplicas: 1
  maxReplicas: 5
  # -- Target CPU utilization percentage for scaling
  targetCPUUtilizationPercentage: 75
  # -- Target memory utilization (set to ~ to disable)
  targetMemoryUtilizationPercentage: ~
  # -- Additional custom metrics for scaling decisions
  additionalMetrics: []

# =============================================================================
# Service Account
# =============================================================================

# -- Service account for the Streamline pods
serviceAccount:
  # -- Create a dedicated ServiceAccount
  create: true
  # -- ServiceAccount name (auto-generated if empty)
  name: ""
  # -- Additional annotations (e.g., for IAM role binding)
  annotations: {}
  # -- Disable auto-mounting the service account token (security hardening)
  automountToken: false

# =============================================================================
# Ingress
# =============================================================================

# -- Ingress for HTTP API access from outside the cluster.
# Only exposes the HTTP API (port 9094); Kafka protocol requires a LoadBalancer.
# This is also where HTTPS for the HTTP API belongs: the `tls` section further
# down configures the *Kafka* listener and does nothing for HTTP, so put a
# certificate in the ingress `tls:` list below (or terminate at a reverse proxy
# / service mesh) if the management API must not travel in the clear.
ingress:
  enabled: false
  # -- Ingress class name (e.g., "nginx", "traefik")
  className: ""
  # -- Ingress annotations
  annotations: {}
    # nginx.ingress.kubernetes.io/proxy-body-size: "10m"
  hosts:
    - host: streamline.local
      paths:
        - path: /
          pathType: Prefix
          servicePort: 9094
  # -- TLS configuration for HTTPS
  tls: []
    # - secretName: streamline-tls
    #   hosts:
    #     - streamline.local

# =============================================================================
# Security — TLS & Authentication
# =============================================================================

# -- TLS for the KAFKA PROTOCOL LISTENER (port 9092) only.
#
# SCOPE — read this before assuming a setting here protects an endpoint:
#   * The variables the chart renders (STREAMLINE_TLS_*) configure the server's
#     Kafka listener. Kafka clients then speak TLS to :9092.
#   * The HTTP API on :9094 is NOT covered. Health checks, metrics and the
#     management API keep serving plaintext HTTP inside the cluster, and the
#     chart's probes target them over plain HTTP. Terminate TLS for HTTP at an
#     ingress controller, a service mesh or a reverse proxy in front of the
#     Service (see the `ingress` section above, whose `tls:` list is the
#     supported way to serve HTTPS).
#   * clientAuth is mutual TLS for Kafka clients only. There is no HTTP mTLS
#     here: nothing in this chart asks the HTTP listener for a client
#     certificate, so do not treat it as an authentication boundary.
#
# TLS is compiled into every Streamline build, so no image capability is
# required — a custom standard-edition build can terminate Kafka TLS just as
# well as the full edition.
#
# The certificate material is mounted read-only at tls.mountPath and the file
# locations are handed to the server through the STREAMLINE_TLS_CERT,
# STREAMLINE_TLS_KEY, STREAMLINE_TLS_CA_CERT and
# STREAMLINE_TLS_REQUIRE_CLIENT_CERT environment variables
# (see templates/configmap.yaml).
tls:
  # -- Enable TLS on the Kafka protocol listener (9092). The HTTP API (9094)
  # is unaffected; use ingress/reverse-proxy TLS for it.
  enabled: false
  # -- Base64-encoded PEM certificate (or use existingSecret)
  certData: ""
  # -- Base64-encoded PEM private key
  keyData: ""
  # -- Base64-encoded PEM CA certificate for verifying Kafka client
  # certificates (mTLS)
  caData: ""
  # -- Use an existing Kubernetes Secret instead of inline cert data.
  # Secret must contain tls.crt, tls.key, and optionally ca.crt keys
  # (the standard kubernetes.io/tls layout). When set, the chart mounts that
  # Secret and generates none of its own. It secures the Kafka listener only —
  # it is not an HTTPS certificate for the HTTP API.
  existingSecret: ""
  # -- Where the certificate material is mounted inside the container
  mountPath: /etc/streamline/tls
  # -- Require client certificates from KAFKA clients (mTLS on 9092). Needs
  # caData, or an existingSecret that contains ca.crt. This does not apply to
  # the HTTP API.
  clientAuth: false

# -- SASL authentication configuration.
# Requires image.edition=full (or "auth" in image.capabilities); the chart
# refuses to render otherwise instead of deploying an unauthenticated broker.
#
# Streamline core authenticates against a YAML *users file* that contains
# precomputed password hashes / SCRAM credentials. It does NOT read a username
# or password from the environment, so the chart cannot generate credentials
# for you: create the users file yourself, put it in a Secret, and point
# auth.existingSecret at it. The Secret is mounted read-only and the server is
# pointed at it through STREAMLINE_AUTH_USERS_FILE.
#
# Example:
#   kubectl create secret generic streamline-auth --from-file=users.yaml
auth:
  # -- Enable authentication on Kafka protocol connections
  enabled: false
  sasl:
    # -- SASL mechanisms to advertise, passed to the server as a
    # comma-separated STREAMLINE_AUTH_SASL_MECHANISMS list.
    # Supported values: PLAIN, SCRAM-SHA-256, SCRAM-SHA-512.
    mechanisms:
      - SCRAM-SHA-256
  # -- Existing Secret holding the users file. REQUIRED when enabled is true.
  existingSecret: ""
  # -- Key inside existingSecret that holds the YAML users file
  usersFileKey: users.yaml
  # -- Where the users file is mounted read-only inside the container
  mountPath: /etc/streamline/auth

# =============================================================================
# KEDA Autoscaling — NOT SUPPORTED YET
# =============================================================================

# -- KEDA-based autoscaling for event-driven scaling.
# Unsupported for the same reason as `autoscaling` above: a ScaledObject scales
# the StatefulSet past one replica, producing independent brokers rather than a
# cluster. `enabled: true` FAILS THE RENDER until peer bootstrap exists; a KEDA
# operator in the cluster does not change that.
keda:
  # -- Enable the KEDA ScaledObject. Must stay false; true fails the render.
  enabled: false
  # -- How often KEDA checks the trigger (seconds)
  pollingInterval: 15
  # -- Cooldown period before scaling down (seconds)
  cooldownPeriod: 300
  # -- Scale to zero when idle (set > 0 to keep minimum replicas warm)
  idleReplicaCount: 0
  # -- Minimum replica count during active scaling
  minReplicaCount: 1
  # -- Maximum replica count
  maxReplicaCount: 10
  # -- KEDA trigger definitions.
  # Default: scale based on messages-per-second from the HTTP metrics endpoint.
  triggers:
    - type: metrics-api
      metadata:
        targetValue: "100000"
        url: "http://{{ include \"streamline.fullname\" . }}:9094/scaling/metrics"
        valueLocation: "messages_per_second"

# =============================================================================
# Moonshot Features (Experimental)
# =============================================================================
# WARNING: This chart cannot configure moonshot features yet. None of these
# settings are rendered into the ConfigMap or the container arguments, so
# switching any of them on FAILS THE RENDER rather than deploying a server that
# ignores them. Declaring "moonshot" in image.capabilities does not change that;
# it only describes what the image contains.
# The keys below are kept to document the intended shape of the configuration
# once the wiring exists.
# See docs/reference/feature-flags.md for details.
moonshot:
  # -- Semantic Topics (M2): embed-on-write vector indexing for semantic search
  semanticTopics:
    enabled: false
    # -- Default embedding model for new semantic topics
    defaultModel: "bge-small"
    # -- Number of background embedding worker threads
    embeddingWorkers: 4
    # -- Maximum pending embed jobs before backpressure is applied
    backpressureThreshold: 10000

  # -- Agent Memory (M1): three-tier persistent memory for AI agents via MCP
  agentMemory:
    enabled: false
    # -- Default episodic memory retention (days)
    episodicRetentionDays: 90
    # -- Decay half-life (days): low-importance memories decay over time
    decayHalfLifeDays: 30
    # -- Enable per-agent envelope encryption
    encryptionEnabled: false

  # -- Contracts & Provenance (M4): producer-side enforcement + attestations
  contracts:
    enabled: false
    # -- KMS provider: "local" (Ed25519 local keys) | "vault" | "aws-kms"
    kmsProvider: "local"
    # -- Vault configuration (when kmsProvider=vault)
    vault:
      url: ""
      mountPath: "transit"
      keyName: "streamline"

  # -- Branched Streams (M5): copy-on-write topic branches for replay
  branches:
    enabled: false
    # -- Maximum storage per branch (bytes)
    maxStorageBytes: 10737418240  # 10GB
    # -- Maximum branch lifetime (hours)
    maxLifetimeHours: 168  # 7 days
    # -- Auto-discard idle branches after this many hours
    autoDiscardIdleHours: 72
