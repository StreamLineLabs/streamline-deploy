{{- include "streamline.validateConfiguration" . -}}
{{- /*
No auth Secret is generated. Streamline core authenticates against a YAML users
file containing precomputed password hashes / SCRAM credentials; the chart has
no way to produce those, so auth.existingSecret is mandatory instead.
*/ -}}
{{- if and .Values.tls.enabled (not .Values.tls.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "streamline.fullname" . }}-tls
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "streamline.labels" . | nindent 4 }}
type: kubernetes.io/tls
data:
  tls.crt: {{ .Values.tls.certData | quote }}
  tls.key: {{ .Values.tls.keyData | quote }}
  {{- if .Values.tls.caData }}
  ca.crt: {{ .Values.tls.caData | quote }}
  {{- end }}
{{- end }}
