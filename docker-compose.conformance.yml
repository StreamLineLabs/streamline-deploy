# SDK Conformance Test Infrastructure
# Pre-configured Streamline server for SDK testing.
#
# No Streamline image is published yet, so there is no runnable default image:
# build one from the pinned core commit (`scripts/prepare-core-context.sh` then
# `make docker STREAMLINE_EDITION=full STREAMLINE_FEATURES=full`, which is the
# edition that carries SASL auth) and name it through STREAMLINE_IMAGE:
#
#   STREAMLINE_IMAGE=streamline:dev \
#     docker compose -f docker-compose.conformance.yml up -d

services:
  streamline-conformance:
    image: ${STREAMLINE_IMAGE:-streamline:set-STREAMLINE_IMAGE}
    container_name: streamline-conformance
    ports:
      - "19092:9092"    # Kafka protocol
      - "19094:9094"    # HTTP API
      - "19192:9192"    # TLS Kafka protocol
    volumes:
      - ./conformance/certs:/etc/streamline/certs:ro
      - ./conformance/config:/etc/streamline/config:ro
    command: >
      streamline
        --config /etc/streamline/config/conformance.toml
        --listen-addr 0.0.0.0:9092
        --http-addr 0.0.0.0:9094
        --data-dir /data
        --log-level debug
    environment:
      STREAMLINE_AUTH_ENABLED: "true"
      STREAMLINE_AUTH_USERS_FILE: /etc/streamline/config/users.yaml
      STREAMLINE_ACL_ENABLED: "true"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9094/health"]
      interval: 3s
      timeout: 2s
      retries: 10
      start_period: 5s
