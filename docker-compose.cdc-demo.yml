# CDC → Streamline → Lakehouse Pipeline Demo — DISABLED (unverified)
#
# THIS DEMO DOES NOT RUN, ON PURPOSE. Every service below sits behind the
# `disabled` Compose profile, so `docker compose -f docker-compose.cdc-demo.yml
# up` selects no service and starts nothing. `demos/cdc-demo.sh` is the
# documented entry point and exits non-zero with the reason.
#
# Why it is disabled — none of the pipeline it advertised can be shown to work
# from this repository:
#
#   * The HTTP surface it drove is unverified. The source-registration route
#     (`/api/v1/cdc/sources`), the JSON body in cdc-demo/cdc-source.json, the
#     start route, the message-read path and the StreamQL endpoint were all
#     copied from documentation, not from a server anyone ran here. No smoke
#     test, conformance run or published image exercises any of them, and
#     there is no way to tell a 404 from a typo without one. Instructions that
#     "work" only in prose are worse than no instructions: they get pasted.
#   * The capabilities are compile-time cargo features (`cdc`, `analytics`).
#     Core reads no STREAMLINE_FEATURES variable, so nothing in an
#     `environment:` block can switch them on — an image either was compiled
#     with them or those endpoints do not exist.
#   * No published tag is built with them. The single publisher
#     (.github/workflows/docker-publish.yml) builds STREAMLINE_FEATURES=full,
#     documented here as SASL auth and clustering, and this repository ships no
#     core sources, so there is no `build:` stanza that could work here either.
#
# The Streamline image below therefore keeps a local-only placeholder that
# matches nothing in any registry: `docker compose config` (and
# `make compose-config`) stays valid with no environment set, while any attempt
# to force the stack up stops on a pull error instead of starting a stock
# server whose CDC endpoints 404.
#
# Re-enabling this demo means, in order: building an image with the cdc and
# analytics features from the pinned core commit, capturing the routes and
# payloads that server actually accepts, adding a test that asserts rows reach
# a topic, and only then removing the `disabled` profile.
# tests/cdc-demo-disabled_test.sh keeps it closed until then.

services:
  # PostgreSQL source database (disabled: part of a pipeline that is not
  # verified end to end).
  postgres:
    profiles: ["disabled"]
    image: postgres:16-alpine
    container_name: cdc-demo-postgres
    environment:
      POSTGRES_USER: demo
      POSTGRES_PASSWORD: demo
      POSTGRES_DB: demo
    ports:
      - "5432:5432"
    command: >
      postgres
        -c wal_level=logical
        -c max_replication_slots=4
        -c max_wal_senders=4
    volumes:
      - ./cdc-demo/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - ./cdc-demo/seed.sql:/docker-entrypoint-initdb.d/seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U demo"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Streamline — would need an image built with the cdc and analytics cargo
  # features. There is no runnable default and the demo is disabled anyway.
  streamline:
    profiles: ["disabled"]
    image: ${STREAMLINE_CDC_IMAGE:-streamline-cdc:demo-disabled-unverified-cdc}
    container_name: cdc-demo-streamline
    ports:
      - "9092:9092"
      - "9094:9094"
    environment:
      - STREAMLINE_LOG_LEVEL=info
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:9094/health"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Grafana for monitoring
  grafana:
    profiles: ["disabled"]
    image: grafana/grafana:11-alpine
    container_name: cdc-demo-grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_AUTH_ANONYMOUS_ENABLED=true

volumes:
  postgres_data:
