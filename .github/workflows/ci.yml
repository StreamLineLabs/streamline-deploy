name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: azure/setup-helm@v4

      - name: Install validation dependencies
        run: |
          helm plugin install https://github.com/helm-unittest/helm-unittest.git --version v1.1.2 --verify=false
          sudo apt-get update
          sudo apt-get install -y shellcheck

      - name: Run complete validation
        run: make test lint

      - name: Run static release gates
        run: make static

  # ---------------------------------------------------------------------------
  # Builds the official image from the pinned core sources. The build itself is
  # the gate: it proves the Dockerfile still compiles the pinned core tree and
  # that the image passes the compose smoke test.
  #
  # THIS JOB FAILS WHILE core-source.env CARRIES NO COMMIT. That is deliberate.
  # The resolver (scripts/prepare-core-context.sh --print-ref) exits non-zero on
  # an empty or non-40-hex pin, its output is not swallowed, and no step in this
  # job is conditional — so an unpinned repository produces a RED image gate
  # instead of a green run with a "skipped" notice. A skip here would mean the
  # release gate reports success for an image nobody can build.
  #
  # To turn it green: pin the full 40-character core commit SHA in
  # core-source.env. Nothing else unlocks it, and `continue-on-error`,
  # `|| true` and `if:` guards are rejected by tests/core-pin-gate_test.sh.
  # ---------------------------------------------------------------------------
  image-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve pinned core commit (fails closed when unpinned)
        id: core
        run: |
          set -euo pipefail
          ref="$(scripts/prepare-core-context.sh --print-ref)"
          echo "ref=$ref" >> "$GITHUB_OUTPUT"

      - name: Checkout Streamline core at the pinned commit
        uses: actions/checkout@v4
        with:
          repository: streamlinelabs/streamline
          ref: ${{ steps.core.outputs.ref }}
          path: .build/core
          persist-credentials: false

      - uses: docker/setup-buildx-action@v3

      - name: Build image (no push)
        uses: docker/build-push-action@v5
        with:
          context: .build/core
          file: Dockerfile
          build-args: |
            STREAMLINE_EDITION=full
            STREAMLINE_FEATURES=full
            STREAMLINE_CORE_REF=${{ steps.core.outputs.ref }}
          push: false
          load: true
          tags: streamline:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test the built image
        env:
          STREAMLINE_IMAGE: streamline:ci
        run: |
          set -euo pipefail
          docker compose -f docker-compose.test.yml up \
            --abort-on-container-exit --exit-code-from smoke-test
          docker compose -f docker-compose.test.yml down -v
