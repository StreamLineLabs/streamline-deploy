# Kustomization for Streamline K8s deployment
# Use: kubectl apply -k k8s/
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: streamline

resources:
  - namespace.yaml
  - configmap.yaml
  - service.yaml
  - statefulset.yaml
  - pod-disruption-budget.yaml
  - networkpolicy.yaml
  # Uncomment if using Prometheus Operator
  # - servicemonitor.yaml

# Common labels applied to all resources
commonLabels:
  app.kubernetes.io/part-of: streamline
  app.kubernetes.io/managed-by: kustomize

# Image customization.
#
# No Streamline image is published yet: `docker-publish.yml` has pushed no tag
# while core-source.env carries no pinned commit, so the base deliberately
# references an unpullable placeholder instead of a release tag that does not
# exist. Build an image from the pinned core commit (see k8s/README.md), then:
#   kustomize edit set image streamline=<registry>/streamline:<tag>
images:
  - name: streamline
    newName: streamline
    newTag: "set-image-before-apply"

