# Streamline PodDisruptionBudget
# Limits *voluntary* disruptions (node drains, evictions) of the standalone
# broker. It is not high availability: with a single broker, an eviction or a
# node failure is downtime — there is no replica to serve clients meanwhile.
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: streamline-pdb
  namespace: streamline
  labels:
    app.kubernetes.io/name: streamline
    app.kubernetes.io/component: availability
spec:
  # Keep the single broker pod available across voluntary disruptions: a drain
  # must wait for the pod to be rescheduled rather than evicting it eagerly.
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: streamline
