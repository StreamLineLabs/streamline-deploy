# Streamline StatefulSet
# Deploys a single standalone Streamline broker with persistent storage and a
# stable network identity. These manifests do NOT deploy a cluster: peer
# bootstrap is not implemented, so extra replicas would be independent brokers
# with their own data and topic metadata — not replicas of each other.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: streamline
  namespace: streamline
  labels:
    app.kubernetes.io/name: streamline
    app.kubernetes.io/component: server
spec:
  serviceName: streamline-headless
  replicas: 1  # Standalone broker: do not scale up, there is no clustering yet
  podManagementPolicy: Parallel
  selector:
    matchLabels:
      app.kubernetes.io/name: streamline
  template:
    metadata:
      labels:
        app.kubernetes.io/name: streamline
        app.kubernetes.io/component: server
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9094"
        prometheus.io/path: "/metrics"
    spec:
      terminationGracePeriodSeconds: 30
      securityContext:
        fsGroup: 1000
        runAsNonRoot: true
        runAsUser: 1000
      containers:
        - name: streamline
          # No Streamline image is published yet, so this base carries a
          # deliberately unpullable placeholder rather than a release tag that
          # nobody has pushed. Build an image from the pinned core commit
          # (see k8s/README.md → "Build the image"), then point this base at it:
          #   kustomize edit set image streamline=<registry>/streamline:<tag>
          # Applying it unchanged fails with ImagePullBackOff — visibly, not
          # silently.
          image: streamline:set-image-before-apply
          imagePullPolicy: IfNotPresent
          ports:
            - name: kafka
              containerPort: 9092
              protocol: TCP
            - name: inter-broker
              # Reserved for clustered mode, which is not implemented yet;
              # nothing connects to this port in a standalone deployment.
              containerPort: 9093
              protocol: TCP
            - name: http
              containerPort: 9094
              protocol: TCP
          envFrom:
            - configMapRef:
                name: streamline-config
          env:
            # Pod identity (exposed for logging/debugging; clustering is not
            # supported by these manifests)
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            # Cluster mode is not supported yet (no peer bootstrap); leaving
            # this commented out is deliberate.
            # - name: STREAMLINE_NODE_ID
            #   value: "$(POD_NAME)"
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "1Gi"
              cpu: "1000m"
          volumeMounts:
            - name: data
              mountPath: /data
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          startupProbe:
            httpGet:
              path: /health/live
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 30
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
  volumeClaimTemplates:
    - metadata:
        name: data
        labels:
          app.kubernetes.io/name: streamline
          app.kubernetes.io/component: storage
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 10Gi
        # Uncomment and set storageClassName for your cluster
        # storageClassName: "standard"
